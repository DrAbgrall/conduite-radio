<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Conduite Radio</title>
<link rel="stylesheet" href="css/styles.css?v=19-layout-2">
<style>.adminPage{max-width:560px;margin:32px auto;padding:24px}.adminPage h1{margin:24px 0}.adminPage form{display:grid;gap:12px}.adminPage label{display:grid;gap:6px}.adminPage input{width:100%;box-sizing:border-box}.adminPage [hidden]{display:none}.adminPage p{line-height:1.5}.adminPage #adminStatus{min-height:1.5em}.adminPage #adminStatus[data-error="true"]{color:#b42318}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0" defer></script><script src="config.js" defer></script><script src="js/supabase-repository.js" defer></script><script src="js/admin.js?v=19-admin-2" defer></script></head>
<body><main class="app adminPage"><a href="index.html">← Espaces</a><h1>Administration</h1>
<form id="adminLogin"><label>Adresse email<input id="adminEmail" type="email" autocomplete="username" required></label><label>Mot de passe<input id="adminPassword" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">Se connecter</button></form>
<section id="adminTools" hidden><h2>Créer un espace</h2><form id="adminCreate"><label>Nom du nouvel espace<input id="adminSpaceName" maxlength="200" required placeholder="Ex. RadioPanik"></label><button type="submit" class="primary">Créer l’espace</button></form><p><a id="adminSpaceLink" hidden>Ouvrir le nouvel espace</a></p><button id="adminLogout" type="button">Se déconnecter</button></section>
<section id="adminDeleteTools" hidden><h2>Supprimer un espace</h2><p>Les émissions et modèles seront conservés dans la corbeille. Une restauration ultérieure les récupérera sans espace.</p><button id="adminLoadSpaces" type="button">Charger les espaces</button><form id="adminDelete"><label>Espace à supprimer<select id="adminDeleteSpace" required><option value="">Choisir un espace</option></select></label><button id="adminReviewDelete" type="button">Vérifier le contenu</button><p id="adminDeleteSummary"></p><label>Recopiez le nom exact pour confirmer<input id="adminDeleteName" autocomplete="off" required></label><button id="adminConfirmDelete" type="submit" disabled>Supprimer cet espace et placer ses conducteurs dans la corbeille</button></form></section>
<p id="adminStatus" role="status" aria-live="polite"></p></main></body></html>
